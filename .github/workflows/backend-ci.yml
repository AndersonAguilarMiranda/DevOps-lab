name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dmz2
          POSTGRES_PASSWORD: dmz2password
          POSTGRES_DB: dmz2db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # Verificación extra para depurar (luego puedes quitarlo)
    - name: Verify Java version
      run: java -version

    - name: Build and Test with Maven
      working-directory: ./backend
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}
      run: mvn -B clean verify
